<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                        "on-tertiary": "#ffffff",
                        "primary-container": "#0070eb",
                        "on-error-container": "#93000a",
                        "secondary": "#006688",
                        "secondary-fixed": "#c2e8ff",
                        "on-surface-variant": "#414755",
                        "tertiary": "#bc000a",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f1f0f5",

                        "inverse-primary": "#adc6ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#005bc1",
                        "surface-container-low": "#f4f3f8",

                        "tertiary-fixed-dim": "#ffb4aa",
                        "on-background": "#1a1b1f",
                        "background": "#faf9fe",
                        "on-primary-fixed": "#001a41"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"

                    "spacing": {
                        "margin-horizontal": "20px",
                        "sm": "8px",

                    "fontSize": {

                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],

                        "body-lg": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "400" }],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col justify-center px-margin-horizontal">
<main class="w-full max-w-md mx-auto flex flex-col items-center">
<!-- Icon -->
<div class="mb-lg rounded-full bg-primary-fixed w-20 h-20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[40px]" data-icon="help_outline">help_outline</span>
</div>
<!-- Header -->
<div class="text-center mb-xl w-full">
<h1 class="text-headline-xl font-headline-xl text-on-surface mb-sm">Forgot Password?</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant max-w-xs mx-auto">
                Enter your email address and we'll send you instructions to reset your password.
            </p>
</div>
<!-- Form -->
<form action="#" class="w-full space-y-lg flex flex-col items-center" method="POST">
<!-- Email Input -->
<div class="w-full text-left">
<label class="block text-label-lg font-label-lg text-on-surface mb-xs" for="email">Email Address</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-xl p-md text-body-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors h-[52px]" id="email" name="email" placeholder="john@example.com" required="" type="email"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-[#007AFF] text-white rounded-xl h-[52px] font-headline-md text-headline-md font-bold flex items-center justify-center hover:opacity-90 active:scale-[0.98] transition-all" type="submit">
                RESET PASSWORD
            </button>
<!-- Back to Login Link -->
<div class="mt-lg pt-sm">
<a class="text-label-lg font-label-lg text-primary hover:opacity-80 transition-opacity flex items-center gap-xs font-bold text-center w-full justify-center" href="#">
                    Back to Login
                </a>
</div>
</form>
</main>
</body></html>
