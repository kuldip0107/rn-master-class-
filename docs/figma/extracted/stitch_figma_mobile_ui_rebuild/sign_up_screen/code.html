<body class="min-h-screen flex flex-col items-center justify-center bg-background px-margin-horizontal">
<main class="w-full max-w-md mx-auto flex flex-col gap-xl">
<!-- Header Section -->
<header class="text-center flex flex-col gap-sm pt-xl">
<h1 class="font-headline-xl text-headline-xl text-on-background">Create Account</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">
                Join our community and start mastering React Native.
            </p>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-lg w-full mt-md">
<!-- Full Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-sm" for="fullName">Full Name</label>
<div class="relative flex items-center w-full">
<input class="w-full bg-[#F2F2F7] text-on-background font-body-md text-body-md rounded-xl px-md h-[56px] border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest focus:outline-none transition-all placeholder:text-outline placeholder:font-body-md" id="fullName" placeholder="Full Name" type="text"/>
</div>
</div>
<!-- Email Address Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-sm" for="email">Email Address</label>
<div class="relative flex items-center w-full">
<input class="w-full bg-[#F2F2F7] text-on-background font-body-md text-body-md rounded-xl px-md h-[56px] border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest focus:outline-none transition-all placeholder:text-outline placeholder:font-body-md" id="email" placeholder="Enter your email" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-sm" for="password">Password</label>
<div class="relative flex items-center w-full">
<input class="w-full bg-[#F2F2F7] text-on-background font-body-md text-body-md rounded-xl pl-md pr-[70px] h-[56px] border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest focus:outline-none transition-all placeholder:text-outline placeholder:font-body-md pr-xl" id="password" placeholder="Create a password" type="password"/>
<button class="absolute right-md font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors h-touch-target flex items-center" type="button">
                        Show
                    </button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-md bg-[#007AFF] text-on-primary font-headline-md text-headline-md h-[56px] rounded-[12px] flex items-center justify-center hover:bg-primary transition-colors active:scale-95 shadow-sm" type="submit">
                SIGN UP
            </button>
</form>
<!-- Footer Section -->
<div class="text-center mt-md pb-xl">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-on-background font-bold hover:text-primary transition-colors ml-xs" href="#">Login</a>
</p>
</div>
