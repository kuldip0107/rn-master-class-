<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - RN Master Class</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#00c1fd",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e3e2e7",
                        "surface-dim": "#dad9df",
                        "on-tertiary-fixed": "#410001",
                        "primary-fixed": "#d8e2ff",
                        "primary-fixed-dim": "#adc6ff",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#004b65",
                        "on-tertiary-container": "#fffbff",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#0070eb",
                        "on-error-container": "#93000a",
                        "secondary": "#006688",
                        "secondary-fixed": "#c2e8ff",
                        "on-surface-variant": "#414755",
                        "tertiary": "#bc000a",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f1f0f5",
                        "inverse-surface": "#2f3034",
                        "inverse-primary": "#adc6ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#005bc1",
                        "surface-container-low": "#f4f3f8",
                        "outline-variant": "#c1c6d7",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#930005",
                        "on-primary-fixed-variant": "#004493",
                        "surface": "#faf9fe",
                        "outline": "#717786",
                        "on-secondary-fixed-variant": "#004d67",
                        "surface-variant": "#e3e2e7",
                        "secondary-fixed-dim": "#75d1ff",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1a1b1f",
                        "tertiary-container": "#e2241f",
                        "surface-container": "#eeedf3",
                        "on-secondary-fixed": "#001e2b",
                        "surface-container-high": "#e9e7ed",
                        "primary": "#0058bc",
                        "on-primary-container": "#fefcff",
                        "surface-bright": "#faf9fe",
                        "tertiary-fixed": "#ffdad5",
                        "tertiary-fixed-dim": "#ffb4aa",
                        "on-background": "#1a1b1f",
                        "background": "#faf9fe",
                        "on-primary-fixed": "#001a41"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "input": "12px",
                        "button": "12px"
                    },
                    "spacing": {
                        "margin-horizontal": "20px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xs": "4px",
                        "xl": "32px",
                        "touch-target": "44px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "headline-xl": ["Inter"],
                        "label-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "code-snippet": ["courierPrime"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-xl": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.5px", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "label-lg": ["13px", { "lineHeight": "18px", "fontWeight": "600" }],
                        "body-lg": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "code-snippet": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center px-margin-horizontal pt-xl pb-xl">
<div class="w-full max-w-[400px] flex flex-col h-full justify-between">
<div class="flex-1 flex flex-col justify-center">
<!-- Logo area -->
<div class="flex justify-center mb-xl">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 0, 'wght' 400;">code</span>
</div>
<!-- Header -->
<div class="text-center mb-xl">
<h1 class="text-headline-xl font-headline-xl text-on-surface mb-sm">Welcome Back!</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Sign in to continue your learning journey.</p>
</div>
<!-- Form -->
<form class="space-y-md">
<!-- Email Input -->
<div class="flex flex-col">
<label class="text-label-lg font-label-lg text-on-surface mb-sm" for="email">Email Address</label>
<input class="w-full h-[52px] rounded-input bg-surface-container-low border-0 px-md text-body-md font-body-md text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors" id="email" placeholder="Enter your email" type="email"/>
</div>
<!-- Password Input -->
<div class="flex flex-col">
<label class="text-label-lg font-label-lg text-on-surface mb-sm" for="password">Password</label>
<div class="relative">
<input class="w-full h-[52px] rounded-input bg-surface-container-low border-0 pl-md pr-[70px] text-body-md font-body-md text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors" id="password" placeholder="Enter your password" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-label-md font-label-md text-primary font-semibold hover:text-primary-container min-h-touch-target min-w-touch-target flex items-center justify-end" type="button">Show</button>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end mt-sm mb-lg">
<a class="text-label-md font-label-md text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<!-- Login Button -->
<button class="w-full h-[52px] bg-[#007AFF] hover:bg-primary-container text-white text-body-lg font-bold rounded-button flex items-center justify-center transition-colors" type="button">
                    LOGIN
                </button>
</form>
</div>
<!-- Footer -->
<div class="text-center mt-xl pb-md">
<p class="text-body-md font-body-md text-on-surface-variant">
                Don't have an account? <a class="text-primary font-semibold hover:underline" href="#">Sign Up</a>
</p>
</div>
</div>
</body></html>
